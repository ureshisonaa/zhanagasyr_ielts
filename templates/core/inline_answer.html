<span class="question-card inline-question" id="question-{{ q.id }}" data-question="{{ q.id }}" data-part="{{ q.part|default:1 }}"><label class="inline-number" for="answer-{{ q.id }}">{{ q.number }}</label>{% if q.type == 'matching' %}{% include 'core/matching_answer.html' %}{% else %}<input type="text" id="answer-{{ q.id }}" name="{{ q.id }}" value="{{ q.value }}" data-answer="{{ q.id }}" maxlength="2000" autocomplete="off" aria-label="Question {{ q.number }}" placeholder="{{ q.number }}">{% endif %}</span>
